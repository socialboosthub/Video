<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta name="theme-color" content="#000000">

    <title>Team Girls VS Team Boys</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         SETUP SCREEN
    ========================== -->

    <section id="setupScreen" class="setup-screen">

        <div class="setup-box">

            <div class="setup-logo">⚔</div>

            <div class="small-title">
                MORTAL KOMBAT STYLE
            </div>

            <h1>
                TEAM
                <span>BATTLE</span>
            </h1>

            <div class="mode-buttons">

                <button class="mode-btn active">
                    STREAMER
                </button>

                <button class="mode-btn">
                    WATCH
                </button>

            </div>

            <input
                id="username"
                type="text"
                placeholder="@ Your username"
            >

            <button id="fightButton" class="fight-button">
                FIGHT!
            </button>

            <div class="demo-option">

                <input
                    id="demoCheckbox"
                    type="checkbox"
                    checked
                >

                <span>
                    DEMO MODE
                    <small>(no TikTok connection)</small>
                </span>

            </div>

            <div class="mapping-title">
                GIFT MAPPING
            </div>

            <div class="gift-mapping">

                <div class="mapping-card girls-card">
                    <strong>GIRLS HIT</strong>
                    <span>1 hit</span>
                </div>

                <div class="mapping-card girls-card">
                    <strong>BRUTALITY</strong>
                    <span>10 hits</span>
                </div>

                <div class="mapping-card boys-card">
                    <strong>BOYS HIT</strong>
                    <span>1 hit</span>
                </div>

                <div class="mapping-card boys-card">
                    <strong>BRUTALITY</strong>
                    <span>10 hits</span>
                </div>

            </div>

            <div class="setup-footer">
                20 HITS TO WIN
            </div>

        </div>

    </section>


    <!-- =========================
         BATTLE SCREEN
    ========================== -->

    <section
        id="battleScreen"
        class="battle-screen hidden"
    >

        <!-- =========================
             16:9 ARENA
        ========================== -->

        <div
            id="battleArena"
            class="battle-arena"
        >

            <!-- BOYS IMAGE
                 This is the bottom layer -->
            <div
                id="boysLayer"
                class="fighter-image boys-layer"
            ></div>


            <!-- GIRLS IMAGE
                 This is the top layer.
                 Its clip boundary moves. -->
            <div
                id="girlsLayer"
                class="fighter-image girls-layer"
            ></div>


            <!-- DARK OVERLAY -->
            <div class="arena-overlay"></div>


            <!-- CENTER DIVIDER -->
            <div
                id="centerDivider"
                class="center-divider"
            >

                <div class="divider-glow"></div>

            </div>


            <!-- =========================
                 TOP UI
            ========================== -->

            <div class="fighter-ui girls-ui">

                <div
                    id="girlsName"
                    class="fighter-name girls-name"
                >
                    MILEENA
                </div>

                <div class="health-container">

                    <div
                        id="girlsHealth"
                        class="health-bar girls-health"
                    ></div>

                </div>

            </div>


            <div class="fighter-ui boys-ui">

                <div
                    id="boysName"
                    class="fighter-name boys-name"
                >
                    SCORPION
                </div>

                <div class="health-container">

                    <div
                        id="boysHealth"
                        class="health-bar boys-health"
                    ></div>

                </div>

            </div>


            <!-- DEMO -->

            <div
                id="demoIndicator"
                class="demo-indicator"
            >
                <span></span>
                DEMO
            </div>


            <!-- ROUND -->

            <div class="round-container">

                <div id="roundText">
                    ROUND 1
                </div>

                <div
                    id="vsText"
                    class="vs-text"
                >
                    VS
                </div>

            </div>


            <!-- HIT TEXT -->

            <div
                id="hitText"
                class="hit-text"
            >
                HIT!
            </div>


            <!-- BRUTALITY TEXT -->

            <div
                id="brutalityText"
                class="brutality-text"
            >
                BRUTALITY!
            </div>


            <!-- WINNER -->

            <div
                id="winnerText"
                class="winner-text"
            >
                GIRLS WIN!
            </div>


            <!-- PARTICLES -->

            <div
                id="particles"
                class="particles"
            ></div>


            <!-- SECRET SETTINGS AREA -->

            <button
                id="secretSettings"
                class="secret-settings"
                aria-label="Settings"
            ></button>

        </div>


        <!-- =========================
             CONTROLS
        ========================== -->

        <div
            id="battleControls"
            class="battle-controls"
        >

            <button
                class="battle-button girls-button"
                data-action="girls-hit"
            >
                GIRLS HIT
            </button>

            <button
                class="battle-button girls-brutality"
                data-action="girls-brutality"
            >
                BRUTALITY!
            </button>

            <button
                class="battle-button boys-button"
                data-action="boys-hit"
            >
                BOYS HIT
            </button>

            <button
                class="battle-button boys-brutality"
                data-action="boys-brutality"
            >
                BRUTALITY!
            </button>

        </div>


        <!-- SMALL OPTIONS BELOW CONTROLS -->

        <div class="bottom-options">

            <button id="restartButton">
                ↻ RESTART
            </button>

            <button id="fullscreenButton">
                ⛶ FULLSCREEN
            </button>

            <span>
                20 HITS TO WIN
            </span>

        </div>


        <!-- =========================
             HIDDEN SETTINGS
        ========================== -->

        <aside
            id="settingsPanel"
            class="settings-panel"
        >

            <div class="settings-header">

                <div>
                    <small>PRIVATE ADMIN</small>

                    <h2>
                        Battle Settings
                    </h2>
                </div>

                <button id="closeSettings">
                    ×
                </button>

            </div>


            <label>
                Girls name

                <input
                    id="girlsNameInput"
                    value="MILEENA"
                >

            </label>


            <label>
                Boys name

                <input
                    id="boysNameInput"
                    value="SCORPION"
                >

            </label>


            <label>
                Sound

                <input
                    id="soundToggle"
                    type="checkbox"
                    checked
                >

            </label>


            <label>
                Show controls

                <input
                    id="controlsToggle"
                    type="checkbox"
                    checked
                >

            </label>


            <label>
                Demo indicator

                <input
                    id="demoToggle"
                    type="checkbox"
                    checked
                >

            </label>


            <div class="settings-buttons">

                <button id="resetButton">
                    RESET
                </button>

                <button id="backButton">
                    SETUP
                </button>

            </div>

        </aside>

    </section>

</div>


<script src="script.js"></script>

</body>
</html>
